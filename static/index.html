<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Gift</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #1e1e2e;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #2d2d3f;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .stars { display: flex; align-items: center; gap: 6px; font-weight: bold; }
    .cases-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      overflow-y: auto;
      flex: 1;
    }
    .case-card {
      background: #2d2d3f;
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .case-card:hover { transform: scale(1.03); }
    .case-image {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin: 0 auto 12px;
    }
    .case-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .case-rarity {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .case-stars { color: gold; font-size: 17px; font-weight: bold; }
    .footer {
      background: #2d2d3f;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.4);
    }
    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
    }
    .footer-item:hover, .footer-item.active { color: white; }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #2d2d3f;
      padding: 24px;
      border-radius: 20px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      position: relative;
    }
    .close {
      position: absolute;
      top: 12px; right: 16px;
      font-size: 28px;
      color: #888;
      cursor: pointer;
    }
    .close:hover { color: white; }
    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
    }
    .btn:hover { background: #0056b3; }
    input {
      padding: 12px;
      margin: 12px 0;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #444;
      background: #3a3a4f;
      color: white;
      font-size: 16px;
    }
    #admin-btn { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="user-info">
      <div class="user-avatar" id="user-initial">?</div>
      <span id="user-name">Загрузка...</span>
    </div>
    <div class="stars">⭐ <span id="user-stars">0</span></div>
  </div>

  <div class="cases-grid" id="cases-grid"></div>

  <div class="footer">
    <div class="footer-item active">🎁 Главная</div>
    <div class="footer-item">⚙️ Апгрейд</div>
    <div class="footer-item" id="admin-btn" onclick="openAdmin()">👑 Админка</div>
    <div class="footer-item">🏆 Рейтинг</div>
    <div class="footer-item">👤 Профиль</div>
  </div>

  <!-- Модалка: открытие кейса -->
  <div id="openModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('openModal')">&times;</span>
      <h3>Открыть кейс?</h3>
      <p id="caseCost">Стоимость: 0 ⭐</p>
      <button class="btn" onclick="confirmOpen()">Открыть</button>
    </div>
  </div>

  <!-- Модалка: результат -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('resultModal')">&times;</span>
      <h3>Поздравляем!</h3>
      <img id="giftImage" src="" style="width:120px; height:120px; object-fit:contain; margin:16px 0;">
      <p id="giftName">Подарок</p>
      <p id="giftStars">Стоимость: 0 ⭐</p>
      <button class="btn" onclick="closeModal('resultModal')">Закрыть</button>
    </div>
  </div>

  <!-- Модалка: админка -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('adminModal')">&times;</span>
      <h3>Админ-панель</h3>
      <button class="btn" onclick="giveAllGifts()">Выдать все NFT</button>
      <input type="number" id="starAmount" placeholder="Количество звёзд" value="1000" min="1">
      <button class="btn" onclick="giveStars()">Выдать звёзды</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentCase = null;

    // Telegram WebApp
    const initData = window.Telegram.WebApp.initDataUnsafe;
    const user = initData.user;

    if (!user) {
      document.body.innerHTML = '<div style="padding:30px;text-align:center;color:white;background:#1e1e2e;font-size:18px;">Запустите через Telegram!</div>';
    } else {
      // Инициализация
      initApp();
    }

    async function initApp() {
      try {
        const res = await fetch('/api/user', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            telegram_id: String(user.id),
            username: user.username || 'unknown'
          })
        });
        const data = await res.json();
        currentUser = data;

        // UI
        const name = user.first_name || 'Пользователь';
        document.getElementById('user-name').textContent = name;
        document.getElementById('user-initial').textContent = name.charAt(0).toUpperCase();
        document.getElementById('user-stars').textContent = data.stars;

        if (data.is_admin) {
          document.getElementById('admin-btn').style.display = 'flex';
        }

        loadCases();
      } catch (e) {
        console.error(e);
        alert('Ошибка инициализации');
      }
    }

    async function loadCases() {
      const res = await fetch('/api/cases');
      const cases = await res.json();
      const grid = document.getElementById('cases-grid');
      grid.innerHTML = '';
      cases.forEach(c => {
        const el = document.createElement('div');
        el.className = 'case-card';
        el.innerHTML = `
          <img src="${c.image_url}" class="case-image" onerror="this.src='https://placehold.co/80?text=🔒'">
          <div class="case-name">${c.name}</div>
          <div class="case-rarity">${c.rarity}</div>
          <div class="case-stars">${c.stars_required}</div>
        `;
        el.onclick = () => {
          currentCase = c;
          document.getElementById('caseCost').textContent = `Стоимость: ${c.stars_required} ⭐`;
          document.getElementById('openModal').style.display = 'flex';
        };
        grid.appendChild(el);
      });
    }

    async function confirmOpen() {
      if (!currentUser || !currentCase) return;
      closeModal('openModal');

      const res = await fetch('/api/open_case', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: currentUser.id, case_id: currentCase.id})
      });
      const data = await res.json();

      if (data.success) {
        currentUser.stars -= currentCase.stars_required;
        document.getElementById('user-stars').textContent = currentUser.stars;

        const gift = data.gift;
        document.getElementById('giftImage').src = gift.image_url;
        document.getElementById('giftName').textContent = gift.name;
        document.getElementById('giftStars').textContent = `Стоимость: ${gift.stars_required} ⭐`;
        document.getElementById('resultModal').style.display = 'flex';
      } else {
        alert('Ошибка: ' + (data.error || 'неизвестно'));
      }
    }

    async function giveAllGifts() {
      const res = await fetch('/api/admin/give-all-gifts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: currentUser.id})
      });
      const data = await res.json();
      if (data.success) {
        alert(`✅ Выдано ${data.count} NFT!`);
        closeModal('adminModal');
      } else {
        alert('❌ Ошибка');
      }
    }

    async function giveStars() {
      const amount = parseInt(document.getElementById('starAmount').value);
      if (!amount || amount <= 0) return alert('Введите число > 0');
      const res = await fetch('/api/admin/give-stars', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: currentUser.id, amount})
      });
      const data = await res.json();
      if (data.success) {
        currentUser.stars += amount;
        document.getElementById('user-stars').textContent = currentUser.stars;
        alert(`✅ Выдано ${amount} ⭐`);
        closeModal('adminModal');
      } else {
        alert('❌ Ошибка');
      }
    }

    function openAdmin() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
