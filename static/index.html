<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Gift</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #2d2d3f;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #555; }
    .stars::before { content: "⭐ "; }
    .cases-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .case-card {
      background: #2d2d3f;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }
    .case-image { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 12px; }
    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
    }
    .footer {
      background: #2d2d3f;
      display: flex;
      justify-content: space-around;
      padding: 12px;
    }
    #admin-btn { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="user-info">
      <div class="user-avatar"></div>
      <span id="user-name">Загрузка...</span>
    </div>
    <div id="user-stars" class="stars">0</div>
  </div>

  <div class="cases-grid" id="cases-grid"></div>

  <div class="footer">
    <div>🎁 Главная</div>
    <div id="admin-btn">👑 Админка</div>
  </div>

  <script>
    const initData = window.Telegram.WebApp.initDataUnsafe;
    const user = initData.user;

    if (!user) {
      document.body.innerHTML = '<div style="padding:20px;color:white;text-align:center">Запустите через Telegram!</div>';
    } else {
      fetch('/api/user', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({telegram_id: user.id, username: user.username || 'unknown'})
      })
      .then(r => r.json())
      .then(data => {
        document.getElementById('user-name').textContent = user.first_name || 'Пользователь';
        document.getElementById('user-stars').textContent = data.stars;
        if (data.is_admin) document.getElementById('admin-btn').style.display = 'block';

        fetch('/api/cases')
        .then(r => r.json())
        .then(cases => {
          const grid = document.getElementById('cases-grid');
          cases.forEach(c => {
            const el = document.createElement('div');
            el.className = 'case-card';
            el.innerHTML = `
              <img src="${c.image_url}" class="case-image">
              <div>${c.name}</div>
              <div>${c.rarity}</div>
              <div class="stars">${c.stars_required}</div>
            `;
            el.onclick = () => alert(`Открыть кейс за ${c.stars_required} ⭐`);
            grid.appendChild(el);
          });
        });
      });
    }
  </script>
</body>
</html>
